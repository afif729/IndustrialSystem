apiVersion: apps/v1
kind: Deployment
metadata:
  name: industrial-monitoring-deployment
  labels:
    app: industrial-monitoring
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: industrial-monitoring
  template:
    metadata:
      labels:
        app: industrial-monitoring
    spec:
      containers:
        - name: monitoring-app
          image: afif729/industrial-monitoring:v1.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: industrial-monitoring-service
spec:
  type: NodePort
  selector:
    app: industrial-monitoring
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
